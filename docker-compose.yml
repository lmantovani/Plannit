services:
  postgres:
    image: postgres:16-alpine
    container_name: plannit-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
      POSTGRES_DB: ${DB_DATABASE:-plannit}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - plannit_pgdata:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d ${DB_DATABASE:-plannit}"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  plannit_pgdata:
    name: plannit_pgdata
